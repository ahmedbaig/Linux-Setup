
services:
  percona-mongo:
    image: percona/percona-server-mongodb:latest
    container_name: percona-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"   # MongoDB port
      - "9216:9216"     # MongoDB Exporter metrics for Prometheus
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-securepassword}
      - ENABLE_EXPORTER=true
      - PMM_SERVER=""
    volumes:
      - percona-mongo-data:/data/db
      - ./init:/docker-entrypoint-initdb.d  # Optional: seed users/databases

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"  # Web UI port
    environment:
      - ME_CONFIG_MONGODB_SERVER=percona-mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-securepassword}
    depends_on:
      - percona-mongo

volumes:
  percona-mongo-data:
