# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# synchronize-panes for all split windows
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# Plugin declarations
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'erikw/tmux-powerline'

bind -T copy-mode    C-c send -X copy-pipe-no-clear "xsel -i --clipboard"
bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "xsel -i --clipboard"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "screen-256color"
set-option -g default-shell /bin/zsh

# Increase scrollback buffer to 50,000 lines
set-option -g history-limit 5000

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"

######################
### Live popup log filter (tmux ≥ 3.2)
######################
# Single pane: Prefix+P → enter keyword/regex → popup streams matching lines (main pane unchanged)
# Requires: grep. Optional: moreutils (ts) for timestamps; remove "| ts" if not installed.
bind-key P display-popup -E 'bash -c "
read -p \"Keyword/Regex: \" kw;
tmux pipe-pane -o \"grep --line-buffered -Ei --color=always \\\"$kw\\\" | ts\"
"'
# Multi-pane: Prefix+A → filter from ALL panes in current window
bind-key A display-popup -E 'bash -c "
read -p \"Keyword/Regex: \" kw;
tmux list-panes -F \"#{pane_id}\" | xargs -I{} tmux pipe-pane -t {} -o \"grep --line-buffered -Ei --color=always \\\"$kw\\\" | ts\"
"'
# Scrollback only (no live): Prefix+/ → fuzzy search over current pane history (requires fzf)
bind-key / display-popup -E "tmux capture-pane -pS - | fzf"
# Clear pipe-pane: current pane only (Prefix+C-p); all panes in window (Prefix+C-P)
bind-key C-p pipe-pane
bind-key C-P run-shell "tmux list-panes -F '#{pane_id}' | xargs -I{} tmux pipe-pane -t {}"


